name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: unit tests
        run: node --test --experimental-test-coverage 'test/*.test.mjs'

  # Builds both microservice images and checks them together through the
  # nginx proxy, exactly as they run in production.
  smoke:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: start the stack
        run: docker compose up -d --build
      - name: probe frontend, proxy and backend
        run: sh scripts/smoke.sh http://localhost:8080
      - name: logs
        if: failure()
        run: docker compose logs
      - name: stop
        if: always()
        run: docker compose down -v

  # The same stack under rootless Podman: the pod manifest via the helper
  # script developers use locally.
  podman:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: podman version
      - name: up, probe, down (data kept)
        run: |
          sh scripts/podman.sh up
          sh scripts/podman.sh status
          sh scripts/smoke.sh http://localhost:8080
          sh scripts/podman.sh down
          podman volume exists wheel-tuner-data
      - name: restart on another port with the kept volume, then remove it
        run: |
          PORT=8090 sh scripts/podman.sh up
          sh scripts/smoke.sh http://localhost:8090
          sh scripts/podman.sh down --volumes
          if podman volume exists wheel-tuner-data; then echo "volume not removed" >&2; exit 1; fi
      - name: logs
        if: failure()
        run: podman pod logs wheel-tuner || true
      - name: cleanup
        if: always()
        run: sh scripts/podman.sh down --volumes

  # Branches and pull requests: build the images only. This job never sees
  # registry credentials.
  build-images:
    name: build image (${{ matrix.image }})
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: wheel-tuner-api
            context: .
            file: Dockerfile
          - image: wheel-tuner-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}

  # Stable check name for branch rulesets: matrix jobs report as
  # "name (matrix values)", so a required check "images" would never arrive.
  images:
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: all image builds succeeded
        run: test "${{ needs.build-images.result }}" = success

  # Push to main (i.e. after a merge): build and publish to quay.io. The
  # credentials live in the protected "quay" environment, which only main may
  # use, so other branches, pull requests and forks cannot read them.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    environment: quay
    strategy:
      matrix:
        include:
          - image: wheel-tuner-api
            context: .
            file: Dockerfile
          - image: wheel-tuner-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/${{ vars.QUAY_NAMESPACE || github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}