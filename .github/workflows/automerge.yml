name: Auto-merge

# Adding the "automerge" label to a pull request into main enables GitHub
# auto-merge (squash): it merges once the required checks pass. Removing the
# label disables it again.
#
# AUTOMERGE_TOKEN must be a fine-grained PAT (or GitHub App token), not
# GITHUB_TOKEN: a merge made with GITHUB_TOKEN does not trigger the push
# workflow on main, so the images would never be published.

on:
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: automerge-${{ github.event.pull_request.number }}

jobs:
  automerge:
    # Same-repository PRs into the default branch only; fork PRs never get
    # secrets, and labels can only be set by collaborators.
    if: >-
      github.event.label.name == 'automerge' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret AUTOMERGE_TOKEN is not set."
            exit 1
          fi
      - name: enable auto-merge
        if: github.event.action == 'labeled'
        run: gh pr merge --auto --squash "$PR_URL"
      - name: disable auto-merge
        if: github.event.action == 'unlabeled'
        run: gh pr merge --disable-auto "$PR_URL"
